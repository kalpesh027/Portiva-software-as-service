# =====================================================================
# Portiva Backend — application.properties (development defaults)
# Override sensitive values via environment variables in production
# =====================================================================

# ===== SERVER =====
server.port=5000
server.servlet.context-path=/api

# ===== APPLICATION PROFILE =====
spring.profiles.active=dev

# ===== DATASOURCE (PostgreSQL 16) =====
# Docker injects SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/portiva
# Local dev: override in .env or use the localhost default below
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:4000/portiva}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:kalpesh123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===== JPA / HIBERNATE =====
# Production: validate (schema managed by Flyway)
# Dev: update for convenience
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Enable JSONB support via PostgreSQL dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ===== REDIS =====
# Docker injects SPRING_DATA_REDIS_HOST=redis, SPRING_DATA_REDIS_PASSWORD=...
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# ===== SPRING MAIL (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:kalpeshghodekar2004@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tdwz zfzl ghlb cate}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== JWT =====
# 256-bit base64-encoded secret — MUST be overridden in production via env var
jwt.secret=${JWT_SECRET:cG9ydGl2YS1zdXBlci1zZWNyZXQta2V5LTI1Ni1iaXQtbG9uZy1zdHJpbmctaGVyZQ==}
# 24 hours in milliseconds
jwt.expiration=86400000

# ===== RAZORPAY =====
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxxxxxx}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:changeme}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:changeme}
# Amounts in INR paise (1 INR = 100 paise)
razorpay.pro-monthly-amount=99900
razorpay.pro-yearly-amount=999900
razorpay.team-monthly-amount=199900
razorpay.team-yearly-amount=1999900

# ===== AI ENGINE =====
# Docker injects AI_ENGINE_URL=http://ai-engine:8000
ai.engine.url=${AI_ENGINE_URL:http://localhost:8000}
ai.engine.connect-timeout=5000
ai.engine.read-timeout=10000

# ===== APP URLs =====
# Docker injects APP_BASE_URL=http://localhost, FRONTEND_URL=http://localhost
app.base-url=${APP_BASE_URL:http://localhost:5000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# ===== RATE LIMITING =====
rate-limit.backend=local
rate-limit.otp-per-hour=5
rate-limit.generate-per-day=3
rate-limit.register-per-hour=10
rate-limit.default-per-minute=100

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# ===== LOGGING (structured, with MDC) =====
logging.level.root=INFO
logging.level.com.portiva=DEBUG
logging.level.org.springframework.security=INFO
# Pattern includes MDC keys requestId and userId
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [reqId=%X{requestId}] [userId=%X{userId}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [reqId=%X{requestId}] [userId=%X{userId}] %-5level %logger{36} - %msg%n

# ===== ASYNC =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ai-worker-

# ===== SCHEDULING =====
spring.task.scheduling.pool.size=3
