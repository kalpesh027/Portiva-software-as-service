# =====================================================================
# Portiva Backend — application-prod.properties
# All secrets MUST be injected via environment variables
# =====================================================================

# ===== SERVER =====
server.port=5000
server.servlet.context-path=/api

# HTTPS enforcement — redirect all HTTP to HTTPS
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:portiva}

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# ===== DATASOURCE =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000

# Production: schema managed by Flyway — never auto-modify
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.cache.redis.time-to-live=300000

# ===== MAIL =====
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== RAZORPAY =====
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# ===== AI ENGINE =====
ai.engine.url=${AI_ENGINE_URL:http://ai-engine:8000}

# ===== APP URLs =====
app.base-url=${APP_BASE_URL:https://portiva.com}
app.frontend-url=${FRONTEND_URL:https://portiva.com}

# ===== ACTUATOR =====
# Expose only health in production — never expose env or beans
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=true
management.health.db.enabled=true

# ===== LOGGING =====
logging.level.root=WARN
logging.level.com.portiva=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
# JSON structured logging for log aggregators (ELK/Loki)
logging.pattern.console={"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","requestId":"%X{requestId}","userId":"%X{userId}","logger":"%logger{36}","message":"%msg"}%n

# ===== RATE LIMITING =====
rate-limit.backend=redis
rate-limit.otp-per-hour=3
rate-limit.generate-per-day=3
rate-limit.register-per-hour=5
rate-limit.default-per-minute=60
