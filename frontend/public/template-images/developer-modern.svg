<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <rect width="400" height="250" fill="#1a1a2e"/>
  
  <!-- Header with accent -->
  <rect width="400" height="40" fill="#6366F1"/>
  <rect x="0" y="40" width="400" height="2" fill="#6366F1" opacity="0.3"/>
  
  <!-- Code-like content -->
  <g fill="#6366F1" opacity="0.6">
    <rect x="20" y="60" width="30" height="4" fill="#00d084"/>
    <rect x="20" y="75" width="360" height="3" fill="#6366F1" opacity="0.3"/>
    <rect x="20" y="85" width="340" height="3" fill="#6366F1" opacity="0.3"/>
    <rect x="20" y="95" width="320" height="3" fill="#6366F1" opacity="0.3"/>
  </g>
  
  <!-- Project cards -->
  <rect x="20" y="120" width="170" height="90" fill="#16213e" stroke="#6366F1" stroke-width="1" rx="4"/>
  <rect x="210" y="120" width="170" height="90" fill="#16213e" stroke="#6366F1" stroke-width="1" rx="4"/>
  
  <!-- Card content -->
  <circle cx="35" cy="135" r="6" fill="#6366F1" opacity="0.4"/>
  <rect x="50" y="132" width="120" height="6" fill="#6366F1" opacity="0.2"/>
  
  <circle cx="225" cy="135" r="6" fill="#6366F1" opacity="0.4"/>
  <rect x="240" y="132" width="120" height="6" fill="#6366F1" opacity="0.2"/>
  
  <!-- Text label -->
  <text x="20" y="245" font-family="Arial" font-size="10" fill="#999">Modern Developer</text>
</svg>
