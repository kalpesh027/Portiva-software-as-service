<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#f0fdf4"/>
  
  <!-- Navigation Bar -->
  <rect width="400" height="45" fill="#10B981"/>
  <text x="20" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">Home</text>
  <text x="80" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="rgba(255,255,255,0.6)">About</text>
  <text x="140" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="rgba(255,255,255,0.6)">Projects</text>
  <text x="220" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="rgba(255,255,255,0.6)">Contact</text>
  
  <!-- Main content area -->
  <!-- Timeline/Career section -->
  <circle cx="40" cy="80" r="4" fill="#10B981"/>
  <line x1="40" y1="84" x2="40" y2="130" stroke="#10B981" stroke-width="2"/>
  
  <circle cx="40" cy="130" r="4" fill="#10B981"/>
  <line x1="40" y1="134" x2="40" y2="180" stroke="#10B981" stroke-width="2" stroke-dasharray="2,2"/>
  
  <!-- Content cards -->
  <rect x="60" y="70" width="300" height="20" fill="#d1fae5" rx="3"/>
  <text x="70" y="82" font-family="Arial" font-size="10" fill="#065f46">Senior Developer at Company</text>
  
  <rect x="60" y="120" width="300" height="20" fill="#d1fae5" rx="3"/>
  <text x="70" y="132" font-family="Arial" font-size="10" fill="#065f46">Experience Timeline & Achievements</text>
  
  <!-- Page indicators -->
  <circle cx="120" cy="220" r="4" fill="#10B981"/>
  <circle cx="140" cy="220" r="4" fill="#d1fae5"/>
  <circle cx="160" cy="220" r="4" fill="#d1fae5"/>
  
  <!-- Text label -->
  <text x="20" y="245" font-family="Arial" font-size="10" fill="#999">Developer Resume (Multi)</text>
</svg>
