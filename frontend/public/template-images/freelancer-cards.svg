<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#fffbeb"/>
  
  <!-- Header -->
  <rect width="400" height="35" fill="#F59E0B"/>
  <text x="200" y="25" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Services & Testimonials</text>
  
  <!-- Service Cards -->
  <!-- Card 1 -->
  <rect x="15" y="55" width="110" height="90" fill="#fef3c7" stroke="#F59E0B" stroke-width="1" rx="4"/>
  <circle cx="55" cy="75" r="8" fill="#F59E0B" opacity="0.3"/>
  <rect x="25" y="90" width="70" height="8" fill="#F59E0B" opacity="0.2" rx="2"/>
  <text x="55" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#92400e">Web Design</text>
  
  <!-- Card 2 -->
  <rect x="145" y="55" width="110" height="90" fill="#fef3c7" stroke="#F59E0B" stroke-width="1" rx="4"/>
  <circle cx="185" cy="75" r="8" fill="#F59E0B" opacity="0.3"/>
  <rect x="155" y="90" width="70" height="8" fill="#F59E0B" opacity="0.2" rx="2"/>
  <text x="185" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#92400e">Development</text>
  
  <!-- Card 3 -->
  <rect x="275" y="55" width="110" height="90" fill="#fef3c7" stroke="#F59E0B" stroke-width="1" rx="4"/>
  <circle cx="315" cy="75" r="8" fill="#F59E0B" opacity="0.3"/>
  <rect x="285" y="90" width="70" height="8" fill="#F59E0B" opacity="0.2" rx="2"/>
  <text x="315" y="140" font-family="Arial" font-size="10" text-anchor="middle" fill="#92400e">Consulting</text>
  
  <!-- Testimonial section -->
  <rect x="20" y="160" width="360" height="60" fill="#white" stroke="#F59E0B" stroke-width="1" rx="4"/>
  <text x="30" y="180" font-family="Arial" font-size="9" font-style="italic" fill="#5a4a00">"Exceptional work with great attention to detail"</text>
  <text x="30" y="200" font-family="Arial" font-size="8" fill="#92400e">⭐⭐⭐⭐⭐ - Happy Client</text>
  
  <!-- Text label -->
  <text x="20" y="245" font-family="Arial" font-size="10" fill="#999">Freelancer Cards</text>
</svg>
