<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="250" fill="#f8f7f4"/>
  
  <!-- Header Bar -->
  <rect width="400" height="50" fill="#8B5CF6"/>
  <circle cx="30" cy="25" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="50" cy="25" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="70" cy="25" r="8" fill="#ffffff" opacity="0.6"/>
  
  <!-- Main Content -->
  <rect x="20" y="70" width="360" height="30" fill="#e0e0e0" rx="4"/>
  <rect x="20" y="110" width="360" height="15" fill="#d4d4d4" rx="2"/>
  <rect x="20" y="135" width="360" height="15" fill="#d4d4d4" rx="2"/>
  
  <!-- Accent Dots -->
  <circle cx="60" cy="180" r="6" fill="#8B5CF6" opacity="0.4"/>
  <circle cx="100" cy="200" r="6" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="140" cy="180" r="6" fill="#8B5CF6" opacity="0.25"/>
  
  <!-- Footer -->
  <line x1="20" y1="230" x2="380" y2="230" stroke="#d4d4d4" stroke-width="1"/>
  <text x="20" y="245" font-family="Arial" font-size="10" fill="#999">Developer Minimal</text>
</svg>
