# =====================================================================
# Portiva — Production Docker Compose
# =====================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: portiva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       portiva
      POSTGRES_USER:     portiva
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portiva -d portiva"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - portiva_net

  redis:
    image: redis:7-alpine
    container_name: portiva_redis
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portiva_net

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    image: portiva-ai-engine:latest
    container_name: portiva_ai_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - portiva_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: portiva-backend:latest
    container_name: portiva_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/portiva
      SPRING_DATASOURCE_USERNAME: portiva
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET:                ${JWT_SECRET}
      MAIL_USERNAME:             ${MAIL_USERNAME}
      MAIL_PASSWORD:             ${MAIL_PASSWORD}
      RAZORPAY_KEY_ID:           ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET:       ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET:   ${RAZORPAY_WEBHOOK_SECRET}
      AI_ENGINE_URL: http://host.docker.internal:8000
      APP_BASE_URL: http://localhost
      FRONTEND_URL: http://localhost,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/api/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - portiva_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: portiva-frontend:latest
    container_name: portiva_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portiva_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  portiva_net:
    driver: bridge
